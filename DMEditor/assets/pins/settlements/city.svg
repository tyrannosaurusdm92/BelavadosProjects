<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 168" role="img" aria-labelledby="title-settlement-city desc-settlement-city" data-pin-kind="settlement" data-settlement-type="City" data-pin-color="#32FF32" style="--pin-color:#32FF32">
  <title id="title-settlement-city">City settlement pin</title>
  <desc id="desc-settlement-city">A glossy, rounded, button-like, non-circular SVG settlement pin colored #32FF32.</desc>
  <defs>
    <linearGradient id="body-settlement-city" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#C6FFC6"/>
      <stop offset="0.25" stop-color="#80FF80"/>
      <stop offset="0.55" stop-color="#32FF32"/>
      <stop offset="1" stop-color="#29D129"/>
    </linearGradient>
    <linearGradient id="face-settlement-city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#C6FFC6"/>
      <stop offset="1" stop-color="#80FF80"/>
    </linearGradient>
    <filter id="shadow-settlement-city" x="-50%" y="-40%" width="200%" height="215%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="shadow-blur"/>
      <feOffset in="shadow-blur" dy="8" result="shadow-offset"/>
      <feFlood flood-color="#000000" flood-opacity="0.50" result="shadow-color"/>
      <feComposite in="shadow-color" in2="shadow-offset" operator="in" result="shadow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="glow-blur"/>
      <feFlood flood-color="#32FF32" flood-opacity="0.62" result="glow-color"/>
      <feComposite in="glow-color" in2="glow-blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hover-settlement-city" x="-60%" y="-50%" width="220%" height="235%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="hover-blur"/>
      <feFlood flood-color="#32FF32" flood-opacity="0.90" result="hover-color"/>
      <feComposite in="hover-color" in2="hover-blur" operator="in" result="hover-glow"/>
      <feMerge><feMergeNode in="hover-glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .pin-button {
      cursor: pointer;
      transform-box: fill-box;
      transform-origin: center;
      transition: transform .16s cubic-bezier(.2,.8,.2,1), filter .16s ease;
      outline: none;
    }
    svg:hover .pin-button,
    .pin-button:hover,
    .pin-button:focus-visible {
      transform: translateY(-3px) scale(1.035);
      filter: url(#hover-settlement-city);
    }
    .pin-button:active {
      transform: translateY(2px) scale(.985);
    }
    @media (prefers-reduced-motion: reduce) {
      .pin-button { transition: none; }
    }
  </style>
  <g class="pin-button" tabindex="0" focusable="true" role="button" aria-label="City settlement">
    <path d="M38 8H90C107 8 119 20 119 37V72C119 91 109 106 95 121L72 158C68 165 60 165 56 158L33 121C19 106 9 91 9 72V37C9 20 21 8 38 8Z"
          fill="url(#body-settlement-city)" stroke="#071014" stroke-width="7" stroke-linejoin="round" filter="url(#shadow-settlement-city)"/>
    <path d="M39 17H89C101 17 110 26 110 38V69C110 84 102 97 88 113L66 150C65 152 63 152 62 150L40 113C26 97 18 84 18 69V38C18 26 27 17 39 17Z"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M39 20H89C100 20 107 27 107 38V45C85 34 45 34 21 47V38C21 27 28 20 39 20Z" fill="#FFFFFF" opacity="0.19"/>
    <rect x="29" y="30" width="70" height="62" rx="22" fill="url(#face-settlement-city)" stroke="#071014" stroke-width="5.5"/>
    <rect x="35" y="36" width="58" height="50" rx="17" fill="none" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="2"/>
    <path d="M42 41C53 34 75 34 86 41" fill="none" stroke="#FFFFFF" stroke-opacity="0.78" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="32" cy="24" r="3.8" fill="#FFFFFF" opacity="0.88"/>
    <circle cx="42" cy="20" r="2.2" fill="#FFFFFF" opacity="0.58"/>
    <rect x="40" y="53" width="13" height="25" rx="3" fill="#0F4C0F"/>
    <rect x="57" y="45" width="15" height="33" rx="3" fill="#0F4C0F"/>
    <rect x="76" y="57" width="12" height="21" rx="3" fill="#0F4C0F"/>
    <path d="M37 79H91" stroke="#0F4C0F" stroke-width="5" stroke-linecap="round"/>
    <path d="M62 51H67M62 58H67M45 59H49M80 63H84" stroke="#FFFFFF" stroke-opacity="0.78" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M54 105Q64 112 74 105" fill="none" stroke="#C6FFC6" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>