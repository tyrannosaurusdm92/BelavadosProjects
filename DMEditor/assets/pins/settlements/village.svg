<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 168" role="img" aria-labelledby="title-settlement-village desc-settlement-village" data-pin-kind="settlement" data-settlement-type="Village" data-pin-color="#8A2BE2" style="--pin-color:#8A2BE2">
  <title id="title-settlement-village">Village settlement pin</title>
  <desc id="desc-settlement-village">A glossy, rounded, button-like, non-circular SVG settlement pin colored #8A2BE2.</desc>
  <defs>
    <linearGradient id="body-settlement-village" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#DEC4F7"/>
      <stop offset="0.25" stop-color="#B67CED"/>
      <stop offset="0.55" stop-color="#8A2BE2"/>
      <stop offset="1" stop-color="#7123B9"/>
    </linearGradient>
    <linearGradient id="face-settlement-village" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#DEC4F7"/>
      <stop offset="1" stop-color="#B67CED"/>
    </linearGradient>
    <filter id="shadow-settlement-village" x="-50%" y="-40%" width="200%" height="215%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="shadow-blur"/>
      <feOffset in="shadow-blur" dy="8" result="shadow-offset"/>
      <feFlood flood-color="#000000" flood-opacity="0.50" result="shadow-color"/>
      <feComposite in="shadow-color" in2="shadow-offset" operator="in" result="shadow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="glow-blur"/>
      <feFlood flood-color="#8A2BE2" flood-opacity="0.62" result="glow-color"/>
      <feComposite in="glow-color" in2="glow-blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hover-settlement-village" x="-60%" y="-50%" width="220%" height="235%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="hover-blur"/>
      <feFlood flood-color="#8A2BE2" flood-opacity="0.90" result="hover-color"/>
      <feComposite in="hover-color" in2="hover-blur" operator="in" result="hover-glow"/>
      <feMerge><feMergeNode in="hover-glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .pin-button {
      cursor: pointer;
      transform-box: fill-box;
      transform-origin: center;
      transition: transform .16s cubic-bezier(.2,.8,.2,1), filter .16s ease;
      outline: none;
    }
    svg:hover .pin-button,
    .pin-button:hover,
    .pin-button:focus-visible {
      transform: translateY(-3px) scale(1.035);
      filter: url(#hover-settlement-village);
    }
    .pin-button:active {
      transform: translateY(2px) scale(.985);
    }
    @media (prefers-reduced-motion: reduce) {
      .pin-button { transition: none; }
    }
  </style>
  <g class="pin-button" tabindex="0" focusable="true" role="button" aria-label="Village settlement">
    <path d="M38 8H90C107 8 119 20 119 37V72C119 91 109 106 95 121L72 158C68 165 60 165 56 158L33 121C19 106 9 91 9 72V37C9 20 21 8 38 8Z"
          fill="url(#body-settlement-village)" stroke="#071014" stroke-width="7" stroke-linejoin="round" filter="url(#shadow-settlement-village)"/>
    <path d="M39 17H89C101 17 110 26 110 38V69C110 84 102 97 88 113L66 150C65 152 63 152 62 150L40 113C26 97 18 84 18 69V38C18 26 27 17 39 17Z"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M39 20H89C100 20 107 27 107 38V45C85 34 45 34 21 47V38C21 27 28 20 39 20Z" fill="#FFFFFF" opacity="0.19"/>
    <rect x="29" y="30" width="70" height="62" rx="22" fill="url(#face-settlement-village)" stroke="#071014" stroke-width="5.5"/>
    <rect x="35" y="36" width="58" height="50" rx="17" fill="none" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="2"/>
    <path d="M42 41C53 34 75 34 86 41" fill="none" stroke="#FFFFFF" stroke-opacity="0.78" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="32" cy="24" r="3.8" fill="#FFFFFF" opacity="0.88"/>
    <circle cx="42" cy="20" r="2.2" fill="#FFFFFF" opacity="0.58"/>
    <path d="M41 61L64 44L87 61V80H41Z" fill="#290D44" stroke="#FFFFFF" stroke-opacity="0.68" stroke-width="2.2" stroke-linejoin="round"/>
    <rect x="56" y="66" width="13" height="14" rx="4" fill="#FFFFFF" opacity="0.82"/>
    <path d="M79 51C88 43 95 48 91 57C88 64 80 64 76 59C74 56 76 53 79 51Z" fill="#290D44"/>
    <path d="M84 54L78 61" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="2" stroke-linecap="round"/>
    <path d="M54 105Q64 112 74 105" fill="none" stroke="#DEC4F7" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>